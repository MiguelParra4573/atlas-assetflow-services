spring:
  application:
    name: activos-service
  data:
    mongodb:
      # El puerto 15205 es el del bloque 152xx de este proyecto; lo publica
      # platform/compose.yaml.
      uri: ${MONGODB_URI:mongodb://localhost:15205/activos}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

server:
  port: 8091
